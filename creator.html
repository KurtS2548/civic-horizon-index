<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Survey Creator - Civic Horizon Index</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

<h1>Civic Horizon Index</h1>

<p>
Survey Creator
</p>

</header>


<section class="poll">

<h2>
Create New Survey
</h2>


<input 
id="question"
placeholder="Enter survey question">


<br><br>


<input 
id="choice1"
placeholder="Choice 1">


<br><br>


<input 
id="choice2"
placeholder="Choice 2">


<br><br>


<input 
id="choice3"
placeholder="Choice 3">


<br><br>


<input 
id="choice4"
placeholder="Choice 4">


<br><br>


<button onclick="createSurvey()">

Create Survey

</button>
<button onclick="logout()">

Logout

</button>

<p id="message"></p>
<hr>

<h2>Existing Surveys</h2>

<div id="surveyList">

Loading surveys...

</div>
<hr>

<h2>Active Survey Preview</h2>

<div id="surveyPreview">

No active survey.

</div>
</section>


<script type="module" src="js/creator.js"></script>


</body>

</html>
