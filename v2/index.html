<!DOCTYPE html>
<html
    lang="en"
    class="auth-access-pending"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Civic Horizon Index | A Better Future Starts With Your Voice
    </title>

    <meta
        name="description"
        content="Civic Horizon Index is an independent civic participation platform where Americans can share their priorities, participate in polls, explore results, and better understand the issues shaping our future."
    >

    <link
        rel="canonical"
        href="https://civichorizonindex.com/"
    >

    <!--
    ==================================================
    FAVICON
    ==================================================
    -->

    <link
        rel="icon"
        type="image/png"
        href="images/logo.png"
    >

    <!--
    ==================================================
    SOCIAL SHARING
    ==================================================
    -->

    <meta
        property="og:type"
        content="website"
    >

    <meta
        property="og:site_name"
        content="Civic Horizon Index"
    >

    <meta
        property="og:title"
        content="Civic Horizon Index | A Better Future Starts With Your Voice"
    >

    <meta
        property="og:description"
        content="Share your priorities, participate in civic polls, explore results, and see what participants across America are saying."
    >

    <meta
        property="og:url"
        content="https://civichorizonindex.com/"
    >

    <meta
        property="og:image"
        content="https://civichorizonindex.com/v2/images/logo.png"
    >

    <meta
        property="og:image:alt"
        content="Civic Horizon Index"
    >

    <meta
        name="twitter:card"
        content="summary"
    >

    <meta
        name="twitter:title"
        content="Civic Horizon Index | A Better Future Starts With Your Voice"
    >

    <meta
        name="twitter:description"
        content="Share your priorities, participate in civic polls, explore results, and see what participants across America are saying."
    >

    <meta
        name="twitter:image"
        content="https://civichorizonindex.com/v2/images/logo.png"
    >

    <!--
    ==================================================
    FONTS
    ==================================================
    -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Merriweather:wght@700&display=swap"
        rel="stylesheet"
    >

    <!--
    ==================================================
    STYLES
    ==================================================
    -->

    <link
        rel="stylesheet"
        href="css/header.css"
    >

    <link
        rel="stylesheet"
        href="css/hero.css"
    >

    <link
        rel="stylesheet"
        href="css/snapshot.css"
    >

    <link
        rel="stylesheet"
        href="css/civic-overview.css"
    >

    <link
        rel="stylesheet"
        href="css/national-priorities.css"
    >

    <link
        rel="stylesheet"
        href="css/community-polls.css"
    >

    <link
        rel="stylesheet"
        href="css/discover.css"
    >

    <link
        rel="stylesheet"
        href="css/mission.css"
    >

    <link
        rel="stylesheet"
        href="css/footer.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: #f7f9fb;
            color: #243b53;
            font-family: "Inter", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

    </style>

</head>

<body>

    <div id="headerContainer"></div>

    <main>

        <div id="heroContainer"></div>

        <div id="snapshotContainer"></div>

        <div id="civicOverviewContainer"></div>

        <div id="nationalPrioritiesContainer"></div>

        <div id="communityPollsContainer"></div>

        <div id="discoverContainer"></div>

        <div id="missionContainer"></div>

    </main>

    <div id="footerContainer"></div>

    <script
        type="module"
        src="js/home.js"
    ></script>

    <script
        type="module"
        src="js/site-auth.js"
    ></script>

</html>
