<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Jurisdiction Test | Civic Horizon Index
    </title>

    <style>

        body {
            margin: 0;
            padding: 40px 20px;
            background: #f8fafc;
            color: #102a43;
            font-family: Arial, sans-serif;
        }

        .test-card {
            width: min(700px, 100%);
            margin: 0 auto;
            padding: 28px;
            border: 1px solid #d9e2ec;
            border-radius: 16px;
            background: #ffffff;
        }

        h1 {
            margin-top: 0;
        }

        .row {
            padding: 12px 0;
            border-bottom: 1px solid #edf2f7;
        }

        .row:last-child {
            border-bottom: 0;
        }

        .label {
            display: block;
            margin-bottom: 4px;
            color: #627d98;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .value {
            font-size: 1rem;
            font-weight: 700;
        }

        .error {
            margin-top: 22px;
            padding: 16px;
            border: 1px solid #e3b9b5;
            border-radius: 10px;
            background: #fff5f4;
            color: #9b2c2c;
            line-height: 1.6;
            white-space: pre-wrap;
        }

    </style>

</head>

<body>

    <main class="test-card">

        <h1>
            Jurisdiction Test
        </h1>

        <div class="row">
            <span class="label">ZIP Code</span>
            <span class="value" id="zipCode">Loading...</span>
        </div>

        <div class="row">
            <span class="label">State</span>
            <span class="value" id="stateCode">Loading...</span>
        </div>

        <div class="row">
            <span class="label">Congressional District</span>
            <span class="value" id="district">Loading...</span>
        </div>

        <div class="row">
            <span class="label">District Ambiguous</span>
            <span class="value" id="districtAmbiguous">Loading...</span>
        </div>

        <div class="row">
            <span class="label">State Voting</span>
            <span class="value" id="stateEligible">Loading...</span>
        </div>

        <div class="row">
            <span class="label">House Voting</span>
            <span class="value" id="districtEligible">Loading...</span>
        </div>

        <div class="row">
            <span class="label">Mayor Voting</span>
            <span class="value" id="municipalityEligible">Loading...</span>
        </div>

        <div class="row">
            <span class="label">Status</span>
            <span class="value" id="status">Loading...</span>
        </div>

        <div
            id="errorBox"
            class="error"
            hidden
        ></div>

    </main>


    <script type="module">

        function setText(
            id,
            value
        ) {

            const element =
                document.getElementById(
                    id
                );


            if (element) {

                element.textContent =
                    String(
                        value
                    );

            }

        }


        function showError(
            error
        ) {

            const errorBox =
                document.getElementById(
                    "errorBox"
                );


            setText(
                "status",
                "Test failed"
            );


            if (!errorBox) {
                return;
            }


            errorBox.hidden =
                false;


            errorBox.textContent =
                error?.stack ||
                error?.message ||
                String(
                    error
                );

        }


        async function start() {

            try {

                const module =
                    await import(
                        "./js/services/participant-jurisdiction-service.js"
                    );


                if (
                    typeof module
                        .getCurrentParticipantJurisdiction !==
                    "function"
                ) {

                    throw new Error(
                        "getCurrentParticipantJurisdiction was not found."
                    );

                }


                const result =
                    await module
                        .getCurrentParticipantJurisdiction();


                setText(
                    "zipCode",
                    result.zipCode ||
                    "Unavailable"
                );


                setText(
                    "stateCode",
                    result.stateCode ||
                    "Unavailable"
                );


                setText(
                    "district",
                    result.congressionalDistrict ||
                    "Not uniquely resolved"
                );


                setText(
                    "districtAmbiguous",
                    result.districtAmbiguous
                        ? "Yes"
                        : "No"
                );


                setText(
                    "stateEligible",
                    result.eligibility?.state
                        ? "Eligible"
                        : "Read only"
                );


                setText(
                    "districtEligible",
                    result.eligibility?.congressionalDistrict
                        ? "Eligible"
                        : "Read only"
                );


                setText(
                    "municipalityEligible",
                    result.eligibility?.municipality
                        ? "Eligible"
                        : "Read only"
                );


                setText(
                    "status",
                    result.status ||
                    "Unavailable"
                );

            } catch (error) {

                console.error(
                    error
                );


                showError(
                    error
                );

            }

        }


        start();

    </script>

</body>

</html>
