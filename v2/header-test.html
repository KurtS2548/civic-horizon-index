<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Header Test - Civic Horizon Index v2
    </title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Merriweather:wght@700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/header.css"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f7f9fb;
            color: #243b53;
            font-family: "Inter", sans-serif;
        }

        .test-content {
            width: min(1100px, calc(100% - 48px));
            margin: 0 auto;
            padding: 90px 0;
        }

        .test-content h1 {
            margin: 0;
            color: #102a43;
            font-family: "Merriweather", serif;
            font-size: clamp(2rem, 5vw, 4rem);
        }

        .test-content p {
            max-width: 650px;
            margin-top: 18px;
            color: #627d98;
            line-height: 1.8;
        }
    </style>

</head>

<body>

    <div id="headerContainer"></div>

    <main class="test-content">

        <h1>
            Civic Horizon Index v2
        </h1>

        <p>
            This temporary page isolates the new header so we can review
            its size, spacing, navigation, dropdowns and mobile behavior
            without interference from the original website.
        </p>

    </main>

    <script src="js/header-test.js"></script>

</body>

</html>
