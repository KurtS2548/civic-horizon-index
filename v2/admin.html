<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Secure Civic Horizon Index administration center."
    >

    <title>
        Admin Center | Civic Horizon Index
    </title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Merriweather:wght@700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/header.css"
    >

    <link
        rel="stylesheet"
        href="css/footer.css"
    >

    <link
        rel="stylesheet"
        href="css/admin.css"
    >

</head>

<body>


    <!--
    ==================================================
    SITE HEADER
    ==================================================
    -->

    <div id="headerContainer"></div>


    <!--
    ==================================================
    SIGNED-IN SESSION BAR
    ==================================================
    -->

    <div id="adminSessionContainer"></div>


    <!--
    ==================================================
    SECURE LOGIN
    ==================================================
    -->

    <div id="adminLoginContainer"></div>


    <!--
    ==================================================
    ADMIN APPLICATION
    ==================================================
    -->

    <main
        class="admin-page"
        id="adminPage"
        hidden
    >


        <!-- ADMIN HERO -->

        <div id="adminHeroContainer"></div>


        <!-- ADMIN OVERVIEW -->

        <div id="adminOverviewContainer"></div>


        <!--
        ==================================================
        POLL SUGGESTIONS

        Participant-submitted poll topics are reviewed
        here before they can move toward publication.
        ==================================================
        -->

        <div id="adminPollSuggestionsContainer"></div>


        <!-- COMMUNITY POLLS -->

        <div id="adminCommunityPollsContainer"></div>


        <!-- CREATE / EDIT POLL -->

        <div id="adminCreatePollContainer"></div>


    </main>


    <!--
    ==================================================
    SITE FOOTER
    ==================================================
    -->

    <div id="footerContainer"></div>


    <!--
    ==================================================
    ADMIN APPLICATION
    ==================================================
    -->

    <script
        type="module"
        src="js/admin.js"
    ></script>


</body>

</html>
