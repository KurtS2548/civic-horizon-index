<section
    class="admin-login"
    id="adminLoginSection"
>

    <div class="admin-login__container">

        <div class="admin-login__panel">

            <div class="admin-login__heading">

                <p>
                    Secure Access
                </p>

                <h1>
                    Admin Sign In
                </h1>

                <span>
                    Sign in with your authorized Civic Horizon Index
                    administrator account.
                </span>

            </div>


            <form
                class="admin-login__form"
                id="adminLoginForm"
            >

                <div class="admin-login__field">

                    <label for="adminLoginEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="adminLoginEmail"
                        name="email"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="admin-login__field">

                    <label for="adminLoginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="adminLoginPassword"
                        name="password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="admin-login__submit"
                    id="adminLoginSubmit"
                >
                    Sign In
                </button>


                <p
                    class="admin-login__message"
                    id="adminLoginMessage"
                    aria-live="polite"
                ></p>

            </form>

        </div>

    </div>

</section>
