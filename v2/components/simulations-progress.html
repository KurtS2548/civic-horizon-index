<section class="simulations-progress-section">

    <div class="simulations-progress-section__container">

        <div class="simulations-progress-card">

            <div class="simulations-progress-card__heading">

                <div>

                    <p class="simulations-section-eyebrow">
                        Your Simulation Journey
                    </p>

                    <h2>
                        Simulation Progress
                    </h2>

                </div>

                <div class="simulations-progress-card__achievement">

                    <span>
                        Current Achievement
                    </span>

                    <strong id="simulationAchievement">
                        New Public Servant
                    </strong>

                </div>

            </div>


            <div class="simulations-progress-track">

                <div
                    id="simulationProgressFill"
                    class="simulations-progress-fill"
                    style="width: 0%;"
                ></div>

            </div>


            <div class="simulations-progress-details">

                <strong id="simulationProgressPercent">
                    0%
                </strong>

                <span id="simulationProgressText">
                    0 of 6 simulations completed
                </span>

            </div>


            <div class="simulations-progress-summary">

                <div>

                    <span>
                        Terms Served
                    </span>

                    <strong id="simulationTermsServed">
                        0
                    </strong>

                </div>

                <div>

                    <span>
                        Latest Grade
                    </span>

                    <strong id="simulationLatestGrade">
                        —
                    </strong>

                </div>

            </div>

        </div>

    </div>

</section>
