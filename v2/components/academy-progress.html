<section class="academy-progress-section">

    <div class="academy-progress-section__container">

        <div class="academy-progress-card">

            <div class="academy-progress-card__heading">

                <div>

                    <p class="academy-section-eyebrow">
                        Your Civic Journey
                    </p>

                    <h2>
                        Academy Progress
                    </h2>

                </div>

                <div class="academy-progress-card__rank">

                    <span>
                        Current Rank
                    </span>

                    <strong id="academyRank">
                        New Civic Explorer
                    </strong>

                </div>

            </div>


            <div class="academy-progress-track">

                <div
                    id="academyProgressFill"
                    class="academy-progress-fill"
                    style="width: 0%;"
                ></div>

            </div>


            <div class="academy-progress-details">

                <strong id="academyProgressPercent">
                    0%
                </strong>

                <span id="academyProgressText">
                    0 of 8 lessons completed
                </span>

            </div>

        </div>

    </div>

</section>
