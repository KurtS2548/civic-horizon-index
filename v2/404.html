<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Page Not Found | Civic Horizon Index
    </title>

    <link
        rel="icon"
        type="image/png"
        href="/images/logo.png"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Merriweather:wght@700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            background: #f7f9fb;
            color: #243b53;
            font-family: "Inter", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .error-page {
            width: 100%;
            max-width: 620px;
            text-align: center;
        }

        .error-page__logo {
            width: 78px;
            height: 78px;
            object-fit: contain;
            margin-bottom: 24px;
        }

        .error-page__code {
            margin: 0 0 10px;
            color: #486581;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .error-page__title {
            margin: 0;
            color: #102a43;
            font-family: "Merriweather", serif;
            font-size: clamp(32px, 6vw, 48px);
            line-height: 1.15;
        }

        .error-page__message {
            max-width: 500px;
            margin: 18px auto 30px;
            color: #627d98;
            font-size: 17px;
            line-height: 1.65;
        }

        .error-page__button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 50px;
            padding: 0 24px;
            border-radius: 10px;
            background: #243b53;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }

        .error-page__button:hover {
            background: #102a43;
            transform: translateY(-1px);
        }

        .error-page__button:focus-visible {
            outline: 3px solid #9fb3c8;
            outline-offset: 4px;
        }

        @media (max-width: 600px) {

            body {
                padding: 24px 18px;
            }

            .error-page__logo {
                width: 64px;
                height: 64px;
            }

            .error-page__message {
                font-size: 16px;
            }

            .error-page__button {
                width: 100%;
            }

        }

    </style>

</head>

<body>

    <main class="error-page">

        <img
            class="error-page__logo"
            src="/images/logo.png"
            alt="Civic Horizon Index"
        >

        <p class="error-page__code">
            Error 404
        </p>

        <h1 class="error-page__title">
            Page Not Found
        </h1>

        <p class="error-page__message">
            The page you were looking for could not be found.
            It may have been moved, removed, or the address may be incorrect.
        </p>

        <a
            class="error-page__button"
            href="/"
        >
            Return Home
        </a>

    </main>

</body>

</html>
